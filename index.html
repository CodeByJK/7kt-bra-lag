<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>7kt Bra Lag</title>
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>

    <div>
      <header class="Rubrik1">
        <div>
          <img src="logo 7kt.png" alt="lagets logga" class="img" />
        </div>
        <h1>7kt Bra Produkter</h1>
      </header>

      <p>
        Vi är fyra killar och en tjej som ser fram emot att lära oss massor om
        att hacka.
      </p>
      <p>
        Vi är ett nyfiket och tävlingsinriktat team som gillar att lösa problem
      </p>
      <p>Vi är redo för utmaningar!</p>
      <ul class="punktlista">
        <li>
          <button
            class="person-btn"
            data-info="Hugo gillar frontend och webbdesign."
          >
            Hugo
          </button>
        </li>
        <li>
          <button
            class="person-btn"
            data-info="Erico brinner för problemlösning och kod."
          >
            Erico
          </button>
        </li>
        <li>
          <button
            class="person-btn"
            data-info="Christan fokuserar på logik och backend."
          >
            Christan
          </button>
        </li>
        <li>
          <button
            class="person-btn"
            data-info="Johanna gillar problemlösning och skappa snygga webbsidor."
          >
            Johanna
          </button>
        </li>
        <li>
          <button
            class="person-btn"
            data-info="Oliver gillar design och att lösa problem."
          >
            Oliver
          </button>
        </li>
      </ul>
    </div>

    <a
      href="https://www.linkedin.com/company/chas-hack/posts/?feedView=all"
      class="linkedin-btn"
      target="_blank"
      rel="noopener noreferrer"
    >
      LinkedIn
    </a>

    <!-- Pop-up rutan som öppnas när man klickar på ett namn -->
    <dialog id="popup">
      <p id="popup-text"></p>
      <button id="close-btn">Stäng</button>
    </dialog>
  </body>
</html>
