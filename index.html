<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>7kt Bra Lag</title>
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="cursor-dot" aria-hidden="true">7</div>
    <div class="cursor-ring" aria-hidden="true"></div>
    <img src="rat-dance.gif" alt="Dansande råtta" class="rat-gif" id="råtta" />

    <div>
      <header class="Rubrik1">
        <div>
          <img src="logo 7kt.png" alt="lagets logga" class="img" />
        </div>
        <h1>7kt Bra Produkter</h1>
      </header>
      <div class="textruta">
        <p>
          Vi är fyra killar och en tjej som ser fram emot att lära oss massor om
          att hacka.
        </p>
        <p>
          Vi är ett nyfiket och tävlingsinriktat team som gillar att lösa
          problem
        </p>
        <p>Vi är redo för utmaningar!</p>
      </div>

      <section class="quote-box" aria-live="polite">
        <p id="quote-text">Tryck på knappen för ett citat!</p>
        <button id="new-quote-btn" type="button">Nytt citat</button>
      </section>

      <ul class="punktlista">
        <li>
          <button
            class="person-btn"
            data-info="Hugo gillar frontend och webbdesign."
          >
            Hugo
          </button>
        </li>
        <li>
          <button
            class="person-btn"
            data-info="Erico brinner för problemlösning och kod."
          >
            Erico
          </button>
        </li>
        <li>
          <button
            class="person-btn"
            data-info="Christan fokuserar på logik och backend."
          >
            Christan
          </button>
        </li>
        <li>
          <button
            class="person-btn"
            data-info="Johanna gillar problemlösning och skappa snygga webbsidor."
          >
            Johanna
          </button>
        </li>
        <li>
          <button
            class="person-btn"
            data-info="Oliver gillar design och att lösa problem."
          >
            Oliver
          </button>
        </li>
      </ul>
    </div>

    <img
      class="gruppbild"
      src="20260911_134618.jpg"
      alt="Gruppbild"
      class="gruppbild"
    />

    <a
      href="https://www.linkedin.com/company/chas-hack/posts/?feedView=all"
      class="linkedin-btn"
      target="_blank"
      rel="noopener noreferrer"
    >
      LinkedIn
    </a>

    <div class="counter-container">
      <h3>Klickräknare</h3>
      <p>Antal klick: <span id="click-count">0</span></p>
      <button id="click-btn">Klicka mig!</button>
    </div>

    <!-- Pop-up rutan som öppnas när man klickar på ett namn -->
    <dialog id="popup">
      <p id="popup-text"></p>
      <button id="close-btn">Stäng</button>
    </dialog>
    <footer class="site-footer">
      <p>&copy; 2026 7kt Bra Lag</p>
    </footer>
  </body>
</html>
